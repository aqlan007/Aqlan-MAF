<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460">
  <defs>
    <clipPath id="rightBeanClipHorizontal">
      <path d="M 6,-92 C 38,-86 74,-52 76,0 C 78,52 38,86 6,92 Z" />
    </clipPath>
  </defs>

  <rect width="700" height="460" fill="#000000" />
  
  <g transform="translate(350, 205)">
    <!-- Letters C and H -->
    <text x="-105" y="44" text-anchor="end" fill="#ffffff" font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="136" letter-spacing="3">CH</text>
    
    <!-- Central Coffee Bean Piano Emblem (The "O") -->
    <g transform="translate(0, -14)">
      <!-- Left Bean Half (Solid White Organic Shape) -->
      <path d="M -6,-90 C -40,-86 -74,-52 -76,0 C -78,52 -40,86 -6,90 C -16,58 -25,26 -19,-6 C -14,-38 -10,-66 -6,-90 Z" fill="#ffffff" />
      
      <!-- Right Bean Half Outer Clip Path / Piano Keys -->
      <g clip-path="url(#rightBeanClipHorizontal)">
        <rect x="6" y="-98" width="85" height="196" fill="#ffffff" />
        <!-- Horizontal Black Slits separating keys -->
        <rect x="6" y="-62" width="85" height="6" fill="#000000" />
        <rect x="6" y="-32" width="85" height="6" fill="#000000" />
        <rect x="6" y="-2" width="85" height="6" fill="#000000" />
        <rect x="6" y="28" width="85" height="6" fill="#000000" />
        <rect x="6" y="58" width="85" height="6" fill="#000000" />
        <!-- Piano Black Keys between white keys -->
        <rect x="6" y="-66" width="32" height="14" rx="2" fill="#000000" />
        <rect x="6" y="-36" width="32" height="14" rx="2" fill="#000000" />
        <rect x="6" y="-6" width="32" height="14" rx="2" fill="#000000" />
        <rect x="6" y="24" width="32" height="14" rx="2" fill="#000000" />
      </g>

      <!-- Center divider line -->
      <line x1="0" y1="-95" x2="0" y2="95" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Letters R and D -->
    <text x="105" y="44" text-anchor="start" fill="#ffffff" font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="136" letter-spacing="3">RD</text>

    <!-- Subtitle: #Kopi_kebun. -->
    <text x="0" y="142" text-anchor="middle" fill="#ffffff" font-family="'Caveat', 'Comic Sans MS', 'Plus Jakarta Sans', cursive, sans-serif" font-weight="700" font-size="48" letter-spacing="1.5">#Kopi_kebun.</text>
  </g>
</svg>
