<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rightBeanClip">
      <path d="M 6,-90 C 35,-85 70,-50 72,0 C 74,50 35,85 6,90 Z" />
    </clipPath>
  </defs>

  <!-- Dark Luxury Cafe App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4" />
  
  <g transform="translate(256, 235)">
    <!-- Letters C and H -->
    <text x="-95" y="40" text-anchor="end" fill="#ffffff" font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="122" letter-spacing="2">CH</text>
    
    <!-- Central Coffee Bean Piano Emblem (The "O") -->
    <g transform="translate(0, -12)">
      <!-- Left Bean Half (Solid White Organic Coffee Bean) -->
      <path d="M -6,-88 C -38,-85 -70,-50 -72,0 C -73,50 -38,85 -6,88 C -16,56 -24,24 -18,-6 C -13,-36 -9,-64 -6,-88 Z" fill="#ffffff" />
      
      <!-- Right Bean Half (Piano Keyboard) -->
      <g clip-path="url(#rightBeanClip)">
        <rect x="6" y="-95" width="80" height="190" fill="#ffffff" />
        <!-- Horizontal Black Slits separating keys -->
        <rect x="6" y="-62" width="80" height="6" fill="#09090b" />
        <rect x="6" y="-32" width="80" height="6" fill="#09090b" />
        <rect x="6" y="-2" width="80" height="6" fill="#09090b" />
        <rect x="6" y="28" width="80" height="6" fill="#09090b" />
        <rect x="6" y="58" width="80" height="6" fill="#09090b" />
        <!-- Piano Black Keys between white keys -->
        <rect x="6" y="-66" width="30" height="14" rx="2" fill="#09090b" />
        <rect x="6" y="-36" width="30" height="14" rx="2" fill="#09090b" />
        <rect x="6" y="-6" width="30" height="14" rx="2" fill="#09090b" />
        <rect x="6" y="24" width="30" height="14" rx="2" fill="#09090b" />
      </g>

      <!-- Center divider gap -->
      <line x1="0" y1="-92" x2="0" y2="92" stroke="#09090b" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Letters R and D -->
    <text x="95" y="40" text-anchor="start" fill="#ffffff" font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="122" letter-spacing="2">RD</text>

    <!-- Subtitle: #Kopi_kebun. -->
    <text x="0" y="132" text-anchor="middle" fill="#ffffff" font-family="'Caveat', 'Comic Sans MS', 'Plus Jakarta Sans', cursive, sans-serif" font-weight="700" font-size="42" letter-spacing="1.2">#Kopi_kebun.</text>
  </g>
</svg>
